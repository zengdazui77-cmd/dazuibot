limit_req_zone $binary_remote_addr zone=team_auth:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=team_api:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=team_connections:10m;
log_format team_safe '$remote_addr - [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name team.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name team.example.com;

    ssl_certificate /etc/letsencrypt/live/team.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/team.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/team-access.log team_safe;

    client_max_body_size 64k;
    limit_req_status 429;
    limit_conn_status 429;
    limit_conn team_connections 20;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    location = /v1/auth/codes {
        limit_req zone=team_auth burst=1 nodelay;
        proxy_pass http://127.0.0.1:8787;
        include /etc/nginx/snippets/team-proxy-headers.conf;
    }

    location = /v1/auth/sessions {
        limit_req zone=team_auth burst=2 nodelay;
        proxy_pass http://127.0.0.1:8787;
        include /etc/nginx/snippets/team-proxy-headers.conf;
    }

    location ~ ^/v1/teams/[^/]+/conversations/[^/]+/events$ {
        limit_req zone=team_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        include /etc/nginx/snippets/team-proxy-headers.conf;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        limit_req zone=team_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8787;
        include /etc/nginx/snippets/team-proxy-headers.conf;
    }
}
